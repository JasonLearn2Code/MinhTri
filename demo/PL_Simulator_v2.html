<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f4f6fa;color:#1b2433;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(16,24,40,.12);padding:26px 24px}
.lock{width:46px;height:46px;border-radius:50%;background:#1f3864;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px}

button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#2f6db5;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label.sh{display:flex;align-items:center;gap:6px;font-size:13px;color:#475467;margin-top:10px}
#err{color:#c0392b;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
